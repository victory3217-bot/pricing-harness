<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격 진단 계산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-sunken: #eeece4;
    --border: #dcd7c9;
    --border-strong: #c7c1ad;
    --text: #201f1a;
    --text-muted: #6b6759;
    --text-faint: #9a9585;
    --accent: #2f6f5e;
    --accent-strong: #1e4c40;
    --accent-soft: #e3ede9;
    --ok: #2f6f5e;
    --ok-soft: #e3ede9;
    --warn: #a2661f;
    --warn-soft: #f3e6d2;
    --error: #a5372f;
    --error-soft: #f3ded9;
    --unknown: #857f6e;
    --unknown-soft: #eae8de;
    --shadow: 0 1px 2px rgba(32,31,26,0.06), 0 8px 24px -12px rgba(32,31,26,0.18);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --font-display: "Noto Serif KR", "Nanum Myeongjo", serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
    --font-mono: "IBM Plex Mono", "Noto Sans Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #17181a;
      --surface: #1f2123;
      --surface-sunken: #191a1c;
      --border: #34373a;
      --border-strong: #464a4d;
      --text: #ece9e1;
      --text-muted: #a4a094;
      --text-faint: #75726a;
      --accent: #6cbba3;
      --accent-strong: #8fd0bb;
      --accent-soft: #223330;
      --ok: #6cbba3;
      --ok-soft: #1f3430;
      --warn: #d6a35a;
      --warn-soft: #362d1e;
      --error: #de8377;
      --error-soft: #3a2321;
      --unknown: #a19c8c;
      --unknown-soft: #2a2b26;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg: #17181a;
    --surface: #1f2123;
    --surface-sunken: #191a1c;
    --border: #34373a;
    --border-strong: #464a4d;
    --text: #ece9e1;
    --text-muted: #a4a094;
    --text-faint: #75726a;
    --accent: #6cbba3;
    --accent-strong: #8fd0bb;
    --accent-soft: #223330;
    --ok: #6cbba3;
    --ok-soft: #1f3430;
    --warn: #d6a35a;
    --warn-soft: #362d1e;
    --error: #de8377;
    --error-soft: #3a2321;
    --unknown: #a19c8c;
    --unknown-soft: #2a2b26;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
  }

  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--accent-soft); color: var(--accent-strong); }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }

  .num{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .page{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  header.top{
    display:flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px;
    padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--border);
  }
  header.top h1{
    font-family: var(--font-display); font-weight: 700; font-size: 27px;
    margin: 0; letter-spacing: -0.01em; text-wrap: balance;
  }
  .scope-note{
    margin: -4px 0 22px; padding: 10px 14px; font-size: 13px; line-height: 1.6;
    color: var(--text-muted); background: var(--surface-sunken);
    border: 1px solid var(--border); border-radius: var(--radius-m, 10px);
  }
  header.top .sub{ color: var(--text-muted); font-size: 14px; flex: 1 1 260px; }
  .proto-chip{
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em;
    color: var(--warn); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    padding: 5px 10px; border-radius: 999px; white-space: nowrap;
  }

  .dl-btn{
    font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
    color: var(--accent-strong); background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    padding: 6px 12px; border-radius: 999px;
  }
  .dl-btn:hover{ border-color: var(--accent); }

  .layout{ display: grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px){ .layout{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l);
    box-shadow: var(--shadow);
  }

  .panel-section{ padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .panel-section:last-child{ border-bottom: none; }
  .panel-section h2{
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-muted); margin: 0 0 14px;
  }

  .field{ display:flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field:last-child{ margin-bottom: 0; }
  .field label{ font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
  .field .hint{ font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  input[type="text"], input[type="number"], select{
    font: inherit; font-family: var(--font-mono); font-size: 13.5px;
    background: var(--surface-sunken); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-s); padding: 8px 10px; width: 100%;
  }
  select{ font-family: var(--font-body); }
  input:focus, select:focus, button:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
  }
  .toggle-row{ display:flex; align-items:center; gap:8px; font-size: 13px; color: var(--text); }
  .toggle-row input{ width: 15px; height: 15px; accent-color: var(--accent); }

  .item-row{
    display:grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 8px; align-items:center;
    padding: 9px 0; border-bottom: 1px dashed var(--border);
  }
  .item-row:last-of-type{ border-bottom: none; }
  .item-row input{ font-size: 12.5px; padding: 7px 8px; }
  .item-row select{ font-size: 12px; padding: 7px 8px; }
  .icon-btn{
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-faint); cursor: pointer; font-size: 15px;
    display:flex; align-items:center; justify-content:center; line-height: 1;
  }
  .icon-btn:hover{ color: var(--error); border-color: var(--error); }
  .add-btn{
    margin-top: 10px; width: 100%; padding: 8px; border-radius: var(--radius-s);
    border: 1px dashed var(--border-strong); background: transparent; color: var(--accent);
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .add-btn:hover{ background: var(--accent-soft); }
  .auto-note{
    margin: 0; padding: 10px 20px; font-size: 12.5px; font-weight: 500; line-height: 1.5;
    color: var(--accent-strong); background: var(--accent-soft);
    border-bottom: 1px solid var(--border); border-radius: var(--radius-l) var(--radius-l) 0 0;
  }
  .section-hint{
    margin: -6px 0 12px; font-size: 12px; line-height: 1.55; color: var(--text-muted);
    background: var(--surface-sunken); border-radius: var(--radius-s); padding: 8px 10px;
  }
  .items-empty{ font-size: 12px; color: var(--text-faint); padding: 6px 0; }

  /* Results side */
  .tabs{ display:flex; gap: 4px; padding: 10px 10px 0; flex-wrap: wrap; }
  .tab{
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text-muted);
    background: transparent; border: 1px solid transparent; border-bottom: none;
    padding: 9px 16px; border-radius: 10px 10px 0 0; cursor: pointer;
  }
  .tab[aria-selected="true"]{
    color: var(--accent-strong); background: var(--surface); border-color: var(--border);
    position: relative; top: 1px;
  }
  .tab:hover:not([aria-selected="true"]){ color: var(--text); }
  .tab .q{ display:block; font-size: 10.5px; font-weight: 500; color: var(--text-faint); margin-top: 1px; }
  .tab[aria-selected="true"] .q{ color: var(--text-muted); }

  .tabpanel{ border-top: 1px solid var(--border); padding: 22px 24px 26px; }
  .tabpanel[hidden]{ display:none; }

  .module-status{
    display:inline-flex; align-items:center; gap: 7px; font-size: 12px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px; margin-bottom: 16px; letter-spacing: 0.02em;
  }
  .module-status .dot{ width: 7px; height:7px; border-radius: 50%; background: currentColor; }
  .status-OK{ color: var(--ok); background: var(--ok-soft); }
  .status-INCOMPLETE{ color: var(--unknown); background: var(--unknown-soft); }
  .status-ERROR{ color: var(--error); background: var(--error-soft); }
  .status-NOT_APPLICABLE{ color: var(--unknown); background: var(--unknown-soft); }

  .metric-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; }
  .metric{
    border: 1px solid var(--border); border-radius: var(--radius-m); padding: 13px 14px;
    background: var(--surface-sunken); display:flex; flex-direction:column; gap: 6px;
  }
  .metric.hero{ background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .metric .m-label{ font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
  .metric .m-value{ font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric .m-value.small{ font-size: 15px; }
  .metric .m-pill{
    align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 2px 7px; border-radius: 999px; text-transform: uppercase;
  }
  .pill-OK{ color: var(--ok); background: var(--ok-soft); }
  .pill-UNKNOWN{ color: var(--unknown); background: var(--unknown-soft); }
  .pill-ESTIMATED{ color: var(--warn); background: var(--warn-soft); }
  .pill-ERROR{ color: var(--error); background: var(--error-soft); }
  .pill-NOT_APPLICABLE{ color: var(--unknown); background: var(--unknown-soft); }
  .metric .m-note{ font-size: 11px; color: var(--text-faint); line-height: 1.4; }

  .waterfall{ margin-top: 20px; }
  .waterfall h3{ font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 0 0 10px; }
  .wf-row{ display:grid; grid-template-columns: 108px 1fr 108px; align-items:center; gap: 10px; margin-bottom: 7px; }
  .wf-row .wf-label{ font-size: 12px; color: var(--text-muted); }
  .wf-row .wf-value{ font-family: var(--font-mono); font-size: 12.5px; text-align:right; font-variant-numeric: tabular-nums; }
  .wf-track{ height: 16px; border-radius: 5px; background: var(--surface-sunken); border: 1px solid var(--border); overflow:hidden; }
  .wf-fill{ height: 100%; border-radius: 4px; }
  .wf-fill.price{ background: var(--text-faint); }
  .wf-fill.direct{ background: var(--warn); }
  .wf-fill.variable{ background: color-mix(in srgb, var(--warn) 55%, var(--accent)); }
  .wf-fill.cm{ background: var(--accent); }

  .warn-box{
    margin-top: 18px; border: 1px solid color-mix(in srgb, var(--error) 40%, var(--border));
    background: var(--error-soft); border-radius: var(--radius-m); padding: 12px 14px;
    font-size: 12.5px; color: var(--text); line-height: 1.55;
  }
  .warn-box.info{ border-color: color-mix(in srgb, var(--unknown) 40%, var(--border)); background: var(--unknown-soft); }
  .warn-box strong{ color: var(--error); }
  .warn-box.info strong{ color: var(--unknown); }

  footer.note{
    margin-top: 26px; font-size: 11.5px; color: var(--text-faint); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  footer.note code{ font-family: var(--font-mono); background: var(--surface-sunken); padding: 1px 5px; border-radius: 4px; }

  .lang-switch{
    margin-left: auto; display: inline-flex; border: 1px solid var(--border);
    border-radius: 999px; overflow: hidden; background: var(--surface);
  }
  .lang-switch button{
    font: inherit; font-size: 12px; font-weight: 600; padding: 5px 13px; border: 0;
    background: transparent; color: var(--text-muted); cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"]{ background: var(--accent-soft); color: var(--accent-strong); }
  .lang-switch button:hover:not([aria-pressed="true"]){ color: var(--text); }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 data-i18n="title"></h1>
    <div class="sub" data-i18n="sub"></div>
    <span class="proto-chip" data-i18n="chip"></span>
    <a class="dl-btn" href="Pricing_Input_Worksheet.xlsx" download data-i18n="dl_sheet" data-i18n-title="dl_sheet_title"></a>
    <div class="lang-switch" role="group" aria-label="Language / 언어">
      <button type="button" data-lang-btn="ko" aria-pressed="true" lang="ko">한국어</button>
      <button type="button" data-lang-btn="en" aria-pressed="false" lang="en">English</button>
    </div>
  </header>
  <p class="scope-note" data-i18n="scope_note"></p>

  <div class="layout">
    <!-- INPUT PANEL -->
    <div class="panel" id="input-panel">
      <p class="auto-note" data-i18n="auto_note"></p>
      <div class="panel-section">
        <h2 data-i18n="sec_price"></h2>
        <div class="field">
          <label for="price" data-i18n="lbl_price"></label>
          <input type="number" id="price" value="35000" min="0" step="100">
        </div>
        <div class="row2">
          <div class="field">
            <label for="vat" data-i18n="lbl_vat"></label>
            <input type="number" id="vat" value="10" min="0" max="100" step="0.5">
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <div class="toggle-row"><input type="checkbox" id="includesVat" checked><label for="includesVat" data-i18n="lbl_incvat"></label></div>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <h2 data-i18n="sec_direct"></h2>
        <p class="section-hint" data-i18n="hint_direct"></p>
        <div id="direct-items"></div>
        <button class="add-btn" id="add-direct" type="button" data-i18n="add_direct"></button>
      </div>

      <div class="panel-section">
        <h2 data-i18n="sec_variable"></h2>
        <p class="section-hint" data-i18n="hint_variable"></p>
        <div id="variable-items"></div>
        <button class="add-btn" id="add-variable" type="button" data-i18n="add_variable"></button>
      </div>

      <div class="panel-section">
        <h2 data-i18n="sec_fixed"></h2>
        <div class="field">
          <label for="fixedCost" data-i18n="lbl_fixed"></label>
          <input type="number" id="fixedCost" value="2000000" min="0" step="10000">
          <span class="hint" data-i18n="hint_fixed"></span>
        </div>
        <div class="field">
          <label for="plannedQty" data-i18n="lbl_qty"></label>
          <input type="number" id="plannedQty" value="200" min="0" step="1">
          <span class="hint" data-i18n="hint_qty"></span>
        </div>
        <div class="field">
          <label for="unitsPerOrder" data-i18n="lbl_upo"></label>
          <input type="number" id="unitsPerOrder" value="" min="0" step="0.1">
          <span class="hint" data-i18n="hint_upo"></span>
        </div>
        <div class="row2">
          <div class="field">
            <label for="targetCmr" data-i18n="lbl_target"></label>
            <input type="number" id="targetCmr" value="45" min="0" max="99" step="0.5">
            <span class="hint" data-i18n="hint_target"></span>
          </div>
          <div class="field">
            <label for="discountRate" data-i18n="lbl_discount"></label>
            <input type="number" id="discountRate" value="0" min="0" max="99" step="1">
            <span class="hint" data-i18n="hint_discount"></span>
          </div>
        </div>
        <div class="field">
          <label for="marketPrice" data-i18n="lbl_market"></label>
          <input type="number" id="marketPrice" value="32000" min="0" step="100">
          <span class="hint" data-i18n="hint_market"></span>
        </div>
      </div>
    </div>

    <!-- RESULTS PANEL -->
    <div class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabbtn-a" aria-selected="true" data-tab="a">MODE A<span class="q" data-i18n="tab_a"></span></button>
        <button class="tab" role="tab" id="tabbtn-b" aria-selected="false" data-tab="b">MODE B<span class="q" data-i18n="tab_b"></span></button>
        <button class="tab" role="tab" id="tabbtn-c" aria-selected="false" data-tab="c">MODE C<span class="q" data-i18n="tab_c"></span></button>
        <button class="tab" role="tab" id="tabbtn-bep" aria-selected="false" data-tab="bep">BEP<span class="q" data-i18n="tab_bep"></span></button>
        <button class="tab" role="tab" id="tabbtn-vp" aria-selected="false" data-tab="vp"><span data-i18n="tab_vp"></span><span class="q" data-i18n="tab_vp_sub"></span></button>
      </div>

      <div class="tabpanel" id="tab-a" role="tabpanel"></div>
      <div class="tabpanel" id="tab-b" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-c" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-bep" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-vp" role="tabpanel" hidden></div>
    </div>
  </div>

  <footer class="note" data-i18n-html="footer"></footer>
</div>

<script>
(function(){
  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

  // ---------- translations (single source for every user-visible string) ----------
  const I18N = {
    ko: {
      title: "가격 진단 계산기",
      sub: "단일 상품의 판매가·원가 구조를 입력하면 현재가 진단, 목표가, 허용원가, 손익분기점을 즉시 계산합니다.",
      chip: "프로토타입 · Python Core 미러링",
      dl_sheet: "⬇ 입력 정리 시트 받기 (.xlsx)",
      dl_sheet_title: "빈 양식 파일을 내려받습니다. 입력한 내용은 내 컴퓨터에만 저장되며 어디에도 전송되지 않습니다.",
      auto_note: "값을 입력하면 결과가 자동으로 계산됩니다 (계산 버튼 없음).",
      sec_price: "판매가 & 부가세",
      lbl_price: "실제 판매가 (KRW)",
      lbl_vat: "부가세율 (%)",
      lbl_incvat: "위 가격은 VAT 포함가",
      sec_direct: "직접원가 (product/service direct cost)",
      add_direct: "+ 직접원가 항목 추가",
      sec_variable: "변동비 (variable selling/delivery)",
      add_variable: "+ 변동비 항목 추가",
      hint_direct: "판매 1단위(또는 1건)당 직접원가를 입력해 주세요. 총비용(예: 개발비 전체)을 그대로 넣으면 결과가 크게 왜곡됩니다. 총비용 ÷ 계획 판매량으로 먼저 계산해 입력하세요. 생산량에 따라 늘어나는 제작 비용(재료비, 개당 전기·가공비 등)도 여기에 1단위당으로 환산해 입력하세요. 수수료·배송비 같은 판매·배송 비용은 아래 변동비에 입력하세요(중복 입력 시 두 번 차감됩니다).",

      vp_est_body: "Fixed per-order costs are assumed to cover one unit per order. If customers buy more than one unit per order, cost is overstated and operating profit is understated. Enter the average units per order to convert them.",
    },
  };

  let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = (key, ...args) => {
    const v = I18N[LANG][key];
    return typeof v === "function" ? v(...args) : v;
  };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

  const numLocale = () => (LANG === "en" ? "en-US" : "ko-KR");
  const fmt = (n, digits=0) => {
    if (n === null || n === undefined || Number.isNaN(n)) return "—";
    return n.toLocaleString(numLocale(), { minimumFractionDigits: digits, maximumFractionDigits: digits });
  };
  const fmtPct = (r) => (r === null || r === undefined || Number.isNaN(r)) ? "—" : (r*100).toLocaleString(numLocale(), { maximumFractionDigits: 1 }) + "%";

  // ---------- dynamic item rows ----------
  // An item with a labelKey still shows its translated default name; typing a name replaces it.
  let directItems = [
    { labelKey: "item_materials", amount: 12000 },
    { labelKey: "item_packaging", amount: 1500 },
  ];
  let variableItems = [
    { labelKey: "item_pg", kind: "gross_payment", amount: null, rate: 2.5 },
    { labelKey: "item_shipping", kind: "per_order", amount: 3000, rate: null },
  ];
  const itemLabel = (item) => item.labelKey ? t(item.labelKey) : (item.label || "");

  function renderDirectItems(){
    const host = $("#direct-items");
    host.innerHTML = "";
    if (directItems.length === 0){
      host.innerHTML = `<div class="items-empty">${t("empty_direct")}</div>`;
    }
    directItems.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "item-row";
      row.style.gridTemplateColumns = "1.4fr 1fr auto";
      row.innerHTML = `
        <input type="text" data-idx="${i}" data-f="label" value="${esc(itemLabel(item))}" placeholder="${t("ph_name")}">
        <input type="number" data-idx="${i}" data-f="amount" value="${item.amount}" placeholder="${t("ph_amount")}">
        <button class="icon-btn" type="button" data-remove="${i}" aria-label="${t("aria_remove")}">×</button>
      `;
      host.appendChild(row);
    });
    host.oninput = (e) => {
      const idx = e.target.getAttribute("data-idx");
      if (idx === null) return;
      const f = e.target.getAttribute("data-f");
      if (f === "amount") directItems[idx].amount = parseFloat(e.target.value);
      else { directItems[idx].label = e.target.value; delete directItems[idx].labelKey; }
      compute();
    };
    host.onclick = (e) => {
      const idx = e.target.getAttribute("data-remove");
      if (idx === null) return;
      directItems.splice(idx, 1);
      renderDirectItems(); compute();
    };
  }

  function renderVariableItems(){
    const host = $("#variable-items");
    host.innerHTML = "";
    if (variableItems.length === 0){
      host.innerHTML = `<div class="items-empty">${t("empty_variable")}</div>`;
    }
    variableItems.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "item-row";
      const isRate = item.kind === "net_sales" || item.kind === "gross_payment";
      row.innerHTML = `
        <input type="text" data-idx="${i}" data-f="label" value="${esc(itemLabel(item))}" placeholder="${t("ph_name")}">
        <select data-idx="${i}" data-f="kind">
          <option value="flat" ${item.kind==='flat'?'selected':''}>${t("kind_flat")}</option>
          <option value="per_order" ${item.kind==='per_order'?'selected':''}>${t("kind_per_order")}</option>
          <option value="net_sales" ${item.kind==='net_sales'?'selected':''}>${t("kind_net_sales")}</option>
          <option value="gross_payment" ${item.kind==='gross_payment'?'selected':''}>${t("kind_gross_payment")}</option>
        </select>
        <input type="number" data-idx="${i}" data-f="value" value="${isRate ? (item.rate ?? '') : (item.amount ?? '')}" placeholder="${isRate ? t("ph_rate") : t("ph_amount")}">
        <button class="icon-btn" type="button" data-remove="${i}" aria-label="${t("aria_remove")}">×</button>
      `;
      host.appendChild(row);
    });
    host.oninput = (e) => {
      const idx = e.target.getAttribute("data-idx");
      if (idx === null) return;
      const f = e.target.getAttribute("data-f");
      const item = variableItems[idx];
      if (f === "label") { item.label = e.target.value; delete item.labelKey; }
      else if (f === "kind") { item.kind = e.target.value; renderVariableItems(); compute(); return; }
      else if (f === "value") {
        const v = parseFloat(e.target.value);
        if (item.kind === "flat" || item.kind === "per_order") item.amount = v; else item.rate = v;
      }
      compute();
    };
    host.onclick = (e) => {
      const idx = e.target.getAttribute("data-remove");
      if (idx === null) return;
      variableItems.splice(idx, 1);
      renderVariableItems(); compute();
    };
  }

  $("#add-direct").onclick = () => { directItems.push({labelKey:"item_new", amount:0}); renderDirectItems(); compute(); };
  $("#add-variable").onclick = () => { variableItems.push({labelKey:"item_new", kind:"flat", amount:0, rate:null}); renderVariableItems(); compute(); };

  // ---------- tabs ----------
  const tabIds = ["a","b","c","bep","vp"];
  tabIds.forEach(id => {
    $("#tabbtn-"+id).onclick = () => {
      tabIds.forEach(x => {
        $("#tabbtn-"+x).setAttribute("aria-selected", x===id ? "true":"false");
        $("#tab-"+x).hidden = x!==id;
      });
    };
  });

  // ---------- metric helpers ----------
  function metricTile({label, value, unit, status, hero, note, digits}){
    const displayVal = status === "OK" || status === "ESTIMATED"
      ? (unit === "%" ? fmtPct(value) : (unit ? fmt(value, digits||0) + " " + unit : fmt(value, digits||0)))
      : (status === "NOT_APPLICABLE" ? t("na") : t("undetermined"));
    return `<div class="metric ${hero?'hero':''}">
      <span class="m-pill pill-${status}">${status}</span>
      <span class="m-label">${label}</span>
      <span class="m-value ${hero?'':'small'}">${displayVal}</span>
      ${note ? `<span class="m-note">${note}</span>` : ""}
    </div>`;
  }
  function moduleStatusBadge(status){
    return `<span class="module-status status-${status}"><span class="dot"></span>${status}</span>`;
  }

  // ---------- core aggregation (mirrors core/engine, single component, no shared-cost) ----------
  function readInputs(){
    return {
      price: parseFloat($("#price").value) || 0,
      v: (parseFloat($("#vat").value) || 0) / 100,
      includesVat: $("#includesVat").checked,
      fixedCost: parseFloat($("#fixedCost").value) || 0,
      t: (parseFloat($("#targetCmr").value) || 0) / 100,
      discountRate: (parseFloat($("#discountRate").value) || 0) / 100,
      marketPrice: parseFloat($("#marketPrice").value) || 0,
      plannedQty: $("#plannedQty").value.trim() === "" ? null : parseFloat($("#plannedQty").value),
      unitsPerOrder: $("#unitsPerOrder").value.trim() === "" ? null : parseFloat($("#unitsPerOrder").value),
    };
  }

  function aggregates(){
    const directTotal = directItems.reduce((s,it) => s + (Number(it.amount)||0), 0);
    let fixedAmt = 0, bRate = 0, aRate = 0;
    const hasPerOrder = variableItems.some(it => it.kind === "per_order" && it.amount !== null && it.amount !== undefined && !Number.isNaN(Number(it.amount)));
    let perOrderAmt = 0;
    variableItems.forEach(it => {
      if (it.kind === "per_order") perOrderAmt += Number(it.amount)||0;
      if (it.kind === "flat" || it.kind === "per_order") fixedAmt += Number(it.amount)||0;
      else if (it.kind === "net_sales") bRate += (Number(it.rate)||0)/100;
      else if (it.kind === "gross_payment") aRate += (Number(it.rate)||0)/100;
    });
    return { directTotal, fixedAmt, perOrderAmt, bRate, aRate, hasPerOrder };
  }

  function computeModeA(inp, agg){
    const { price, v, includesVat } = inp;
    const N = includesVat ? price/(1+v) : price;
    const gPay = includesVat ? price : price*(1+v);
    const variableTotal = agg.fixedAmt + agg.bRate*N + agg.aRate*gPay;
    const grossProfit = N - agg.directTotal;
    const grossProfitRate = N !== 0 ? grossProfit/N : null;
    const cm = grossProfit - variableTotal;
    const cmRate = N !== 0 ? cm/N : null;
    const status = (N>0) ? "OK" : "ERROR";
    return { N, gPay, variableTotal, grossProfit, grossProfitRate, cm, cmRate, status };
  }

  function computeModeB(inp, agg){
    const { v, t, includesVat, discountRate } = inp;
    const C = agg.directTotal + agg.fixedAmt;
    const b = agg.bRate, a = agg.aRate;
    const D = 1 - t - b - a*(1+v);
    if (D <= 0){
      return { status: "ERROR", D };
    }
    const N = C / D;
    const G = N * (1+v);
    const requiredSellingPrice = includesVat ? G : N;
    const requiredListPrice = discountRate > 0 ? requiredSellingPrice/(1-discountRate) : requiredSellingPrice;
    const expectedCm = t * N;
    return { status: "OK", D, N, G, requiredSellingPrice, requiredListPrice, expectedCm };
  }

  function computeModeC(inp, agg){
    const { v, t, includesVat, marketPrice } = inp;
    if (!marketPrice || marketPrice <= 0) return { status: "ERROR", reason: "no_price" };
    const Nm = includesVat ? marketPrice/(1+v) : marketPrice;
    const Gm = includesVat ? marketPrice : marketPrice*(1+v);
    const F = agg.fixedAmt, b = agg.bRate, a = agg.aRate;
    const adc = Nm*(1 - t - b) - a*Gm - F;
    const actualDirectCost = agg.directTotal;
    const gap = adc - actualDirectCost;
    const expectedCm = Nm - adc - F - b*Nm - (a>0 ? a*Gm : 0);
    const expectedCmRate = Nm !== 0 ? expectedCm/Nm : null;
    return { status: "OK", Nm, Gm, adc, actualDirectCost, gap, expectedCm, expectedCmRate };
  }

  function computeBep(inp, agg, modeA){
    const { fixedCost } = inp;
    const cmu = modeA.cm;
    if (cmu === 0){
      return { status: "NOT_APPLICABLE", cmu, reason: fixedCost===0 ? "zero_zero" : "zero_margin" };
    }
    if (cmu < 0){
      return { status: "NOT_APPLICABLE", cmu, reason: "negative_margin" };
    }
    const q = fixedCost / cmu;
    return { status: "OK", cmu, q, fixedCost };
  }

  function computeVolume(inp, agg, modeA){
    const q = inp.plannedQty;
    const u = inp.unitsPerOrder;
    // An invalid average is an error whatever else is missing (ERROR beats UNKNOWN, as in the engine).
    if (u !== null && (Number.isNaN(u) || u <= 0)) return { status: "ERROR", reason: "units" };
    if (q === null) return { status: "UNKNOWN" };
    if (Number.isNaN(q) || q < 0) return { status: "ERROR", reason: "negative" };
    if (modeA.status !== "OK") return { status: "ERROR", reason: "price" };
    // modeA.cm counts the per-order amount in full; a valid u adds back amount x (1 - 1/u).
    const N = modeA.N, cmu = u === null ? modeA.cm : modeA.cm + agg.perOrderAmt * (1 - 1 / u), fc = inp.fixedCost;
    const totalSales = N * q, totalCm = cmu * q, op = totalCm - fc;
    const opRate = totalSales === 0 ? null : op / totalSales;
    let be = null, beNa = null;
    if (cmu > 0) be = fc / cmu;
    else beNa = cmu < 0 ? "negative" : (fc === 0 ? "zero_zero" : "zero");
    const mosQty = be === null ? null : q - be;
    const mosRate = (be === null || q === 0) ? null : (q - be) / q;
    const est = agg.hasPerOrder && u === null;
    const uApplied = agg.hasPerOrder && u !== null && u !== 1 ? u : null;
    return { status: "OK", q, N, cmu, fc, est, uApplied, totalSales, totalCm, op, opRate, be, beNa, mosQty, mosRate };
  }

  // ---------- render ----------
  function renderModeA(inp, agg, r){
    const moduleStatus = r.status;
    const maxVal = Math.max(inp.price, r.N, 1);
    const wf = (label, val, cls) => `
      <div class="wf-row">
        <span class="wf-label">${label}</span>
        <div class="wf-track"><div class="wf-fill ${cls}" style="width:${Math.max(0,Math.min(100, (val/maxVal)*100))}%"></div></div>
        <span class="wf-value num">${fmt(val)}</span>
      </div>`;
    $("#tab-a").innerHTML = `
      ${moduleStatusBadge(moduleStatus)}
      <div class="metric-grid">
        ${metricTile({label:t("a_n"), value:r.N, status:"OK", note:t("a_n_note")})}
        ${metricTile({label:t("a_direct"), value:agg.directTotal, status:"OK"})}
        ${metricTile({label:t("a_gp"), value:r.grossProfit, status:"OK"})}
        ${metricTile({label:t("a_gpr"), value:r.grossProfitRate, unit:"%", status:"OK"})}
        ${metricTile({label:t("a_var"), value:r.variableTotal, status:"OK"})}
        ${metricTile({label:t("a_cm"), value:r.cm, status:"OK", hero:true})}
        ${metricTile({label:t("a_cmr"), value:r.cmRate, unit:"%", status:"OK", hero:true})}
      </div>
      <div class="waterfall">
        <h3>${t("a_wf_title")}</h3>
        ${wf(t("a_wf_price"), r.N, "price")}
        ${wf(t("a_wf_direct"), agg.directTotal, "direct")}
        ${wf(t("a_wf_var"), r.variableTotal, "variable")}
        ${wf(t("a_wf_cm"), r.cm, "cm")}
      </div>
    `;
  }

  function renderModeB(inp, r){
    if (r.status === "ERROR"){
      $("#tab-b").innerHTML = `
        ${moduleStatusBadge("ERROR")}
        <div class="warn-box"><strong>${t("b_err_strong")}</strong> ${t("b_err_body", fmtPct(inp.t))}</div>`;
      return;
    }
    $("#tab-b").innerHTML = `
      ${moduleStatusBadge("OK")}
      <div class="metric-grid">
        ${metricTile({label:t("b_n"), value:r.N, status:"OK"})}
        ${metricTile({label:t("b_g"), value:r.G, status:"OK"})}
        ${metricTile({label:t("b_price"), value:r.requiredSellingPrice, status:"OK", hero:true, note: inp.includesVat ? t("b_price_note_incl") : t("b_price_note_excl")})}
        ${metricTile({label:t("b_list"), value:r.requiredListPrice, status:"OK", hero:true, note:t("b_list_note", fmtPct(inp.discountRate))})}
        ${metricTile({label:t("b_ecm"), value:r.expectedCm, status:"OK"})}
      </div>`;
  }

  function renderModeC(inp, r){
    if (r.status === "ERROR"){
      $("#tab-c").innerHTML = `${moduleStatusBadge("INCOMPLETE")}
        <div class="warn-box info"><strong>${t("c_err_strong")}</strong> ${t("c_err_body")}</div>`;
      return;
    }
    const negative = r.adc < 0;
    $("#tab-c").innerHTML = `
      ${moduleStatusBadge("OK")}
      <div class="metric-grid">
        ${metricTile({label:t("c_nm"), value:r.Nm, status:"OK"})}
        ${metricTile({label:t("c_gm"), value:r.Gm, status:"OK"})}
        ${metricTile({label:t("c_adc"), value:r.adc, status:"OK", hero:true, note: negative ? t("c_adc_note_neg") : t("c_adc_note_pos")})}
        ${metricTile({label:t("c_actual"), value:r.actualDirectCost, status:"OK"})}
        ${metricTile({label:t("c_gap"), value:r.gap, status:"OK", note: r.gap>=0 ? t("c_gap_ok") : t("c_gap_over")})}
        ${metricTile({label:t("c_ecmr"), value:r.expectedCmRate, unit:"%", status:"OK"})}
      </div>
      ${negative ? `<div class="warn-box"><strong>${t("c_neg_strong")}</strong> ${t("c_neg_body")}</div>` : ""}
    `;
  }

  function renderBep(inp, r){
    if (r.status === "NOT_APPLICABLE"){
      const msg = r.reason === "zero_zero" ? t("bep_zero_zero")
        : r.reason === "zero_margin" ? t("bep_zero")
        : t("bep_negative");
      $("#tab-bep").innerHTML = `
        ${moduleStatusBadge("NOT_APPLICABLE")}
        <div class="metric-grid">
          ${metricTile({label:t("bep_cmu"), value:r.cmu, status:"OK"})}
          ${metricTile({label:t("bep_q_label"), value:null, status:"NOT_APPLICABLE"})}
        </div>
        <div class="warn-box">${msg}</div>`;
      return;
    }
    $("#tab-bep").innerHTML = `
      ${moduleStatusBadge("OK")}
      <div class="metric-grid">
        ${metricTile({label:t("bep_cmu_full"), value:r.cmu, status:"OK"})}
        ${metricTile({label:t("bep_fc"), value:r.fixedCost, status:"OK"})}
        ${metricTile({label:t("bep_q_full"), value:r.q, unit:t("unit_count"), status:"OK", hero:true, digits:2})}
      </div>`;
  }

  function renderVolume(inp, r){
    const host = $("#tab-vp");
    if (r.status === "UNKNOWN"){
      host.innerHTML = `${moduleStatusBadge("INCOMPLETE")}
        <div class="warn-box info"><strong>${t("vp_unknown_strong")}</strong> ${t("vp_unknown_body")}</div>`;
      return;
    }
    if (r.status === "ERROR"){
      const msg = r.reason === "units" ? t("vp_error_units")
        : r.reason === "negative" ? t("vp_error_negative") : t("vp_error_price");
      host.innerHTML = `${moduleStatusBadge("ERROR")}<div class="warn-box"><strong>${t("vp_error_strong")}</strong> ${msg}</div>`;
      return;
    }
    const cs = r.est ? "ESTIMATED" : "OK";
    const beNaStatus = r.be === null ? "NOT_APPLICABLE" : cs;
    const maxQ = Math.max(r.q, r.be || 0, 1);
    const bar = (label, val, cls) => `
      <div class="wf-row">
        <span class="wf-label">${label}</span>
        <div class="wf-track"><div class="wf-fill ${cls}" style="width:${Math.max(0, Math.min(100, (val/maxQ)*100))}%"></div></div>
        <span class="wf-value num">${fmt(val, 1)}</span>
      </div>`;
    const beMsg = r.beNa === "negative" ? t("vp_be_negative")
      : r.beNa === "zero_zero" ? t("vp_be_zero_zero")
      : t("vp_be_zero");
    host.innerHTML = `
      ${moduleStatusBadge("OK")}
      <div class="metric-grid">
        ${metricTile({label:t("vp_q"), value:r.q, unit:t("unit_count"), status:"OK"})}
        ${metricTile({label:t("vp_sales"), value:r.totalSales, status:"OK"})}
        ${metricTile({label:t("vp_tcm"), value:r.totalCm, status:cs})}
        ${metricTile({label:t("vp_op"), value:r.op, status:cs, hero:true, note: r.op < 0 ? t("vp_op_note_loss") : t("vp_op_note_gain")})}
        ${metricTile({label:t("vp_opr"), value:r.opRate, unit:"%", status: r.opRate === null ? "NOT_APPLICABLE" : cs})}
        ${metricTile({label:t("vp_be"), value:r.be, unit:t("unit_count"), status:beNaStatus, digits:2})}
        ${metricTile({label:t("vp_mos"), value:r.mosQty, unit:t("unit_count"), status:beNaStatus, hero:true, digits:2, note: r.mosQty !== null && r.mosQty < 0 ? t("vp_mos_note") : ""})}
        ${metricTile({label:t("vp_mosr"), value:r.mosRate, unit:"%", status: r.mosRate === null ? "NOT_APPLICABLE" : cs, hero:true})}
      </div>
      ${r.be !== null ? `<div class="waterfall"><h3>${t("vp_bars_title")}</h3>${bar(t("vp_bar_plan"), r.q, "cm")}${bar(t("vp_bar_be"), r.be, "direct")}</div>` : ""}
      ${r.be === null ? `<div class="warn-box info"><strong>${t("vp_no_be_strong")}</strong> ${beMsg}</div>` : ""}
      ${r.mosQty !== null && r.mosQty < 0 ? `<div class="warn-box"><strong>${t("vp_below_strong")}</strong> ${t("vp_below_body")}</div>` : ""}
      ${r.est ? `<div class="warn-box info"><strong>${t("vp_est_strong")}</strong> ${t("vp_est_body")}</div>` : ""}
      ${r.uApplied !== null ? `<div class="warn-box info"><strong>${t("vp_upo_strong")}</strong> ${t("vp_upo_body", String(r.uApplied))}</div>` : ""}
    `;
  }

  function compute(){
    const inp = readInputs();
    const agg = aggregates();
    const modeA = computeModeA(inp, agg);
    const modeB = computeModeB(inp, agg);
    const modeC = computeModeC(inp, agg);
    const bep = computeBep(inp, agg, modeA);
    const volume = computeVolume(inp, agg, modeA);
    renderModeA(inp, agg, modeA);
    renderModeB(inp, modeB);
    renderModeC(inp, modeC);
    renderBep(inp, bep);
    renderVolume(inp, volume);
  }

  // ---------- language ----------
  function applyStatic(){
    document.documentElement.lang = LANG;
    document.title = t("title");
    $$("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
    $$("[data-i18n-title]").forEach(el => { el.title = t(el.getAttribute("data-i18n-title")); });
    $$("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    $$("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn") === LANG ? "true" : "false"));
  }
  function setLang(next){
    LANG = next;
    try {
      const url = new URL(location.href);
      if (LANG === "en") url.searchParams.set("lang", "en"); else url.searchParams.delete("lang");
      history.replaceState(null, "", url);
    } catch (e) { /* non-critical: the URL just keeps its old query */ }
    applyStatic(); renderDirectItems(); renderVariableItems(); compute();
  }
  $$("[data-lang-btn]").forEach(b => { b.onclick = () => setLang(b.getAttribute("data-lang-btn")); });

  applyStatic();
  renderDirectItems();
  renderVariableItems();
  compute();
  document.addEventListener("input", (e) => {
    if (e.target.closest("#input-panel")) compute();
  });
})();
</script>
</body>
</html>
